# Game
seed: null
area: [64, 64]
view: [70, 70]
length: null
health: 9
sapling_from_grass_probability: 0.0
window: [1000, 1000]
size: [0, 0]
record: null
fps: 5
wait: false
death: reset

runtime:
  spawn_objects: false
  spawn_random_objects: true
  move_objects: false
  move_random_objects: true
  hunger_decreases: false
  thirst_decreases: false
