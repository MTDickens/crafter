defaults:
  - tamp_planner: pattern_learning
  - _self_

seed: 2026
headless: false
episodes: 30
workers: 1
area: [64, 64]
view: [70, 70]
length: null
health: 9
sapling_from_grass_probability: 0.0
window: [1000, 1000]
size: [0, 0]
record: null
fps: 5
wait: false
death: reset

runtime:
  spawn_objects: false
  spawn_random_objects: true
  move_objects: false
  move_random_objects: true
  hunger_decreases: false
  thirst_decreases: false
  energy_decreases: false
  daylight_cycle: false

map_generation:
  max_reset_attempts: 10
  minimum_resources:
    tree: 9
    stone: 8
    coal: 3
    iron: 3
    diamond: 1

# Task and motion planner
planner:
  enabled: true
  exit_on_finish: true
  output_dir: planner_results
  plan_only: false
  render_known_world: task # none, task, step (not implemented)
  result_logging:
    - reveal_count
  task_order:
    - collect_wood
    - place_table
    - make_wood_pickaxe
    - make_wood_sword
    - collect_stone
    - place_stone
    - make_stone_pickaxe
    - make_stone_sword
    - place_furnace
    - collect_coal
    - collect_iron
    - make_iron_pickaxe
    - make_iron_sword
    - collect_diamond

hydra:
  run:
    dir: .
  output_subdir: null
  job:
    chdir: false
