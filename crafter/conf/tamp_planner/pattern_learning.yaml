  initial_patterns:
    load_from_planner_results: null
    add_center_only_placeholders: true
    presets: []

  skill_proposal:
    enabled: true
    trigger_interval: 5
    patterns_per_trigger: 10

    max_examples_in_prompt: 10
    max_examples_in_prompt_order: random # first, last, random

    use_bounding_box: true # crop each map to the min bbox containing non-unknown cells

    enable_tiling: true # split each map/bbox into overlapping tiles as examples before prompting
    tile_size: [15, 15] # tile width and height, only used when enable_tiling=true
    tile_overlap: [3, 3] # overlap width and height, only used when enable_tiling=true

    include_tile_coordinates: false # include tile coordinates in the prompt metadata
    prompt_token_case: lower # lower or upper, only affects prompt rendering

    dummy_response_path: null

  lbfgs:
    max_iters: 20
    lr: 1.0
