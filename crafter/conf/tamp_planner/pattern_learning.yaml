# @package planner

defaults:
  - skill_proposal/llm_cfg@skill_learning.skill_proposal.llm_cfg: gpt-5.4-happyapi
  - _self_

name: pattern_learning

skill_learning:
  enable_inference: true
  enable_reweighting: true
  enable_hard_inference: true

  replay_buffer:
    capacity: 20

  sampling_method:
    mode: iid_known_drop # connected_reverse_trajectory or iid_known_drop
    pure_samples_per_map: 20
    pure_drop_prob: 0.5 # only used for iid_known_drop
    seed: 42

  eps: 1e-3
  device: cpu

  # limit: 5
  # train_on_full_desc: false
  # exploration_extra_points_per_map: 15
  train_trigger_interval: 5
  infer_prob_threshold: 1.0
  max_examples_learned: 100
  max_examples_learned_order: random # first, last, random

