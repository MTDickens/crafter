[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "crafter"
version = "1.8.3"
description = "Open world survival game for reinforcement learning."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Danijar Hafner" }]
classifiers = [
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Games/Entertainment",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy",
    "imageio",
    "pillow",
    "opensimplex",
    "ruamel.yaml",
    "pygame",
    "ruff>=0.15.10",
    "ty>=0.0.29",
    "hydra-core>=1.3.2",
    "torch>=2.11.0",
    "openai>=2.32.0",
    "tenacity>=9.1.4",
    "cairosvg>=2.9.0",
]

[tool.ruff]
indent-width = 2

[tool.ruff.format]
quote-style = "single"

[project.urls]
Homepage = "http://github.com/danijar/crafter"

[project.optional-dependencies]
gui = ["pygame"]

[project.scripts]
crafter = "crafter.run_gui:main"

[tool.setuptools]
packages = ["crafter"]

[tool.setuptools.package-data]
crafter = ["data.yaml", "assets/*", "conf/*.yaml"]
