defaults:
  - override hydra/job_logging: disabled
  - override hydra/hydra_logging: disabled
  - _self_

input_root: planner_results

timestamps:
  # - 20260418T234848
  # - 20260419T001041
  - 20260419T014812
  - 20260419T014830
  - 20260419T021030

metrics:
  - metrics.reveal_count

stats:
  enabled: true
  reduction: mean
  output_path: null

plot:
  enabled: true
  metric: metrics.reveal_count
  layout: same_axes # same_axes or separate_axes
  title: Planner Result Metric by Episode
  output_path: plots/planner_result_stats.png

hydra:
  run:
    dir: .
  output_subdir: null
  job:
    chdir: false
