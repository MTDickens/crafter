metrics:
  - metrics.reveal_count

stats:
  enabled: true
  reduction: mean

  # Cross-timestamp summary of the per-timestamp reductions above.
  # For each metric, this first computes one value per timestamp using
  # stats.reduction, then summarizes those timestamp values.
  all_timestamps:
    enabled: true
    key: ALL_TIMESTAMPS

    # Mean over all configured timestamps.
    mean: true

    # Sample standard deviation over all configured timestamps.
    # If only one timestamp is configured, stdev is reported as null.
    stdev: true

  output_path: null

plot:
  # Selection
  enabled: true
  metric: metrics.reveal_count
  layout: same_axes # same_axes or separate_axes
  moving_average: 1 # trailing window; 1 disables smoothing

  # Matplotlib / output
  title: Planner Result Metric by Episode
  output_path: plots/planner_result_stats_250430.png

pattern_library:
  # Selection / export
  enabled: false
  output_path: null
  weight_field: positive_weight # raw_weight or positive_weight

  plot:
    # Selection
    enabled: true
    use_selected_patterns: false # false -> plot all logged patterns; true -> filter to patterns below
    add_center_only_placeholders: false # whether to also track ungated placeholder patterns

    # These are only the patterns to TRACK/DRAW in the stats plot below.
    # They do not initialize the planner library; that lives in
    # crafter/conf/tamp_planner/pattern_learning.yaml under planner.skill_learning.initial_patterns.
    selected_patterns:
      - center: grass
        top: grass
        bottom: grass
        left: grass
        right: grass
      - center: tree
        top: grass
        bottom: grass
        left: grass
        right: grass
      - center: stone
        top: stone
        bottom: stone
        left: stone
        right: stone
      - center: coal
        top: stone
        bottom: stone
        left: stone
        right: stone
      - center: iron
        top: stone
        bottom: stone
        left: stone
        right: stone
      - center: diamond
        top: stone
        bottom: stone
        left: stone
        right: stone

    # Plot behavior
    draw_patterns: false # render selected pattern cards next to each timestamp subplot
    mark_first_appearance: true # add a same-color dot where a selected pattern first appears
    yscale: linear # linear or log

    # Matplotlib / output
    title: Pattern Weights by Episode
    output_path: plots/pattern_learning_weights_250430.png

    # Pattern-card rendering
    asset_dir: crafter/assets
    tile_size: 32
    card_padding: 6
    label_height: 86
    resolution_scale: 2
    font_size: 12
    background_rgba: [ 240, 240, 240, 255 ]

hydra:
  run:
    dir: .
  output_subdir: null
  job:
    chdir: false
