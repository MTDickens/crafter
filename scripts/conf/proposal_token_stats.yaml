defaults:
  - override hydra/job_logging: disabled
  - override hydra/hydra_logging: disabled
  - _self_

input_root: planner_results_final/PITWI
# input_root: planner_results_final/PITWI wo inference
# input_root: planner_results_final/PITWI wo reweighting
# input_root: planner_results_final/PITWI wo initial placeholder


# Inclusive cutoff. null means use all proposal logs.
# For example, 49 means proposals after episodes 0, 1, ..., 49.
max_episode_index: 49

# If true, drop the last remaining proposal log per timestamp after applying
# max_episode_index. For example, with max_episode_index=49, this excludes
# after-episode-00049 when that proposal exists.
exclude_last_proposal: true

timestamps:
  # planner_results_final/PITWI
